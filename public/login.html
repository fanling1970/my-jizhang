<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · my-jizhang</title>
  <style>
    :root {
      --bg: #f7f8fa; --surface: #ffffff; --border: #e4e7eb;
      --text: #2b2f36; --muted: #8b93a0; --primary: #3f6cff;
      --primary-soft: #eaf0ff; --expense: #d9534f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef1f6 0%, #f7f8fa 60%, #eef2fb 100%);
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
    }
    .card {
      width: 340px; max-width: calc(100vw - 32px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 32px 28px 24px;
      box-shadow: 0 8px 30px rgba(60, 80, 120, 0.08);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--primary); color: #fff; font-weight: 700;
      display: grid; place-items: center; font-size: 17px;
    }
    .brand-name { font-size: 18px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 22px; }
    label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    input[type=password] {
      width: 100%; height: 40px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; background: #fbfcfd;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=password]:focus {
      border-color: var(--primary); background: #fff;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    button {
      width: 100%; height: 40px; margin-top: 16px;
      border: 0; border-radius: 6px; background: var(--primary); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--expense); }
    .msg.ok { color: #2e9e5b; }
    .tip { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.6; border-top: 1px dashed var(--border); padding-top: 12px; }
    .field + .field { margin-top: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <span class="brand-mark">¥</span>
      <span class="brand-name">my-jizhang</span>
    </div>
    <div class="sub" id="sub">家庭记账本 · 请输入密码登录</div>
    <div class="field">
      <label for="pw" id="label-pw">登录密码</label>
      <input id="pw" type="password" autofocus placeholder="请输入密码">
    </div>
    <div class="field" id="field-pw2" hidden>
      <label for="pw2">确认密码</label>
      <input id="pw2" type="password" placeholder="再次输入密码">
    </div>
    <button type="submit" id="btn">登 录</button>
    <div class="msg" id="msg"></div>
    <div class="tip" id="tip">
      登录后请在「设置」中修改密码。忘记密码可用环境变量 <code>INIT_PASSWORD</code> 重置。
    </div>
  </form>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('form');
      var sub = document.getElementById('sub');
      var labelPw = document.getElementById('label-pw');
      var fieldPw2 = document.getElementById('field-pw2');
      var pw = document.getElementById('pw');
      var pw2 = document.getElementById('pw2');
      var btn = document.getElementById('btn');
      var msg = document.getElementById('msg');
      var tip = document.getElementById('tip');
      var mode = 'login'; // 'login' | 'setup'

      function applyMode(m) {
        mode = m;
        if (m === 'setup') {
          sub.textContent = '首次使用 · 设置登录密码';
          labelPw.textContent = '设置登录密码';
          pw.placeholder = '至少 6 位';
          fieldPw2.hidden = false;
          btn.textContent = '设置并进入';
          tip.innerHTML = '密码是解密数据的唯一凭证，<b>请务必牢记</b>。忘记密码将无法恢复数据。';
          pw2.value = '';
        } else {
          sub.textContent = '家庭记账本 · 请输入密码登录';
          labelPw.textContent = '登录密码';
          pw.placeholder = '请输入密码';
          fieldPw2.hidden = true;
          btn.textContent = '登 录';
          tip.innerHTML = '登录后请在「设置」中修改密码。忘记密码可用环境变量 <code>INIT_PASSWORD</code> 重置。';
        }
        pw.value = '';
      }

      // 检查认证状态：已登录则进应用；未设置密码则进入设置模式
      fetch('/api/auth/status', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d) return;
          if (d.authenticated) { location.href = '/'; return; }
          if (d.needsSetup) applyMode('setup');
          else applyMode('login');
        })
        .catch(function () {});

      function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = 'msg' + (ok ? ' ok' : '');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var p = pw.value;
        if (!p) { showMsg('请输入密码'); pw.focus(); return; }
        var url, body;
        if (mode === 'setup') {
          if (p.length < 6) { showMsg('密码至少 6 位'); pw.focus(); return; }
          if (p !== pw2.value) { showMsg('两次输入的密码不一致'); pw2.focus(); return; }
          url = '/api/setup';
          body = JSON.stringify({ password: p });
        } else {
          url = '/api/login';
          body = JSON.stringify({ password: p });
        }
        btn.disabled = true; showMsg('', false);
        fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: body,
        }).then(function (r) {
          if (!r.ok) {
            return r.json().then(function (d) {
              throw new Error((d && d.error) || (r.status === 429 ? '尝试过于频繁，请稍后再试' : '操作失败'));
            }, function () { throw new Error('操作失败'); });
          }
          location.href = '/';
        }).catch(function (err) {
          showMsg(err.message || '操作失败');
          btn.disabled = false; pw.select();
        });
      });
    })();
  </script>
</body>
</html>
