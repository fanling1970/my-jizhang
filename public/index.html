<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-jizhang · 家庭记账本</title>
  <link rel="stylesheet" href="styles.css?v=20261126d">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">¥</span>
        <span class="brand-name">my-jizhang</span>
      </div>
      <div class="tab-strip" id="tab-strip"></div>
      <div class="topbar-right">
        <button class="icon-btn" id="btn-settings" title="设置 / 改密 / 备份 / 日志">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5l.8 1.9 2-.5.5 2 1.9.8-.5 2 .5 2-1.9.8-.5 2-2-.5L8 14.5l-.8-1.9-2 .5-.5-2L2.8 10.3l.5-2-.5-2 1.9-.8.5-2 2 .5z"/></svg>
        </button>
        <button class="icon-btn" id="btn-logout" title="退出登录">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2H3v12h3"/><path d="M10.5 8H6m0 0l2.5-2.5M6 8l2.5 2.5"/></svg>
        </button>
        <span class="save-status" id="save-status"></span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">文档</span>
          <div class="sidebar-actions">
            <button class="icon-btn" id="btn-locate" title="定位打开的文档">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><circle cx="8" cy="8" r="6"/><path d="M8.5 2l-1-.1v-2M8.5 16l-1 .1v2M2 7.5l-.1-1h-2M16 8.5l.1-1h2"/></svg>
            </button>
            <button class="icon-btn" id="btn-foldall" title="全部展开 / 收起">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5l4 4 4-4"/></svg>
            </button>
            <button class="icon-btn" id="btn-sidebar-more" title="更多">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><circle cx="3.5" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="12.5" cy="8" r="1.5"/></svg>
            </button>
            <button class="icon-btn" id="btn-sidebar-collapse" title="最小化侧边栏">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3.5L11 8l-5 4.5"/></svg>
            </button>
          </div>
        </div>
        <div class="tree" id="tree"></div>
      </aside>

      <aside class="sidebar-collapsed" id="sidebar-collapsed" hidden>
        <button class="icon-btn expand-btn" title="展开侧边栏">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3.5L5 8l5 4.5"/></svg>
        </button>
      </aside>

      <main class="editor is-empty" id="editor">
        <div class="format-bar" id="format-bar">
          <div class="fb-group">
            <button class="fmt-btn" data-cmd="undo" title="撤销">↶</button>
            <button class="fmt-btn" data-cmd="redo" title="重做">↷</button>
          </div>
          <div class="fb-divider"></div>
          <select class="font-size" id="font-size" title="字号">
            <option value="">字号</option>
            <option value="12">12</option>
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="24">24</option>
            <option value="28">28</option>
            <option value="32">32</option>
          </select>
          <button class="fmt-btn bold" data-cmd="bold" title="加粗">B</button>
          <button class="fmt-btn italic" data-cmd="italic" title="倾斜">I</button>
          <button class="fmt-btn underline" data-cmd="underline" title="下划线">U</button>
          <input type="color" id="font-color" class="font-color" value="#24292f" title="字体颜色">
          <div class="fb-divider"></div>
          <button class="fmt-btn wide" id="btn-image">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 10.5l3-3 2.5 2.5 3-3 3.5 3.5"/><circle cx="5.5" cy="6" r="1"/></svg>
            插入图片
          </button>
          <button class="fmt-btn wide" id="btn-net-image">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2.4 2 9.6 0 12M8 2c-2 2.4-2 9.6 0 12"/></svg>
            网络图片
          </button>
          <div class="fb-divider"></div>
          <button class="fmt-btn wide income" id="btn-income">＋ 收入</button>
          <button class="fmt-btn wide expense" id="btn-expense">－ 支出</button>
          <button class="fmt-btn wide total" id="btn-total">自动合计</button>
        </div>

        <div class="doc-scroll" id="doc-scroll">
          <div class="doc-inner" id="doc-inner">
            <div class="doc-breadcrumb" id="doc-breadcrumb"></div>
            <h1 class="doc-title" id="doc-title" contenteditable="true" spellcheck="false"></h1>
            <div class="doc-body" id="doc-body" contenteditable="true" spellcheck="false" data-placeholder="点击工具栏的「收入 / 支出」开始记录…"></div>
          </div>
        </div>

        <div class="empty-state" id="empty-state">
          <div class="empty-icon">¥</div>
          <p>从左侧目录里选择一个文档开始记账</p>
        </div>
      </main>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden>
  <input type="file" id="import-input" accept=".json,application/json" hidden>

  <!-- 设置面板：修改密码 / 备份 / 审计日志 / 导入导出 -->
  <div class="modal" id="settings-modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-panel">
      <div class="modal-head">
        <span>设置</span>
        <button class="modal-close" data-close>×</button>
      </div>
      <div class="modal-body">
        <section class="set-section">
          <h3>修改密码</h3>
          <div class="set-row"><label>旧密码</label><input type="password" id="set-old" placeholder="当前密码"></div>
          <div class="set-row"><label>新密码</label><input type="password" id="set-new" placeholder="至少 6 位"></div>
          <div class="set-row"><label>确认新密码</label><input type="password" id="set-new2" placeholder="再次输入"></div>
          <button class="set-btn primary" id="btn-change-pw">保存新密码</button>
          <div class="set-msg" id="pw-msg"></div>
        </section>

        <section class="set-section">
          <h3>备份</h3>
          <div class="set-row-actions">
            <button class="set-btn" id="btn-backup-now">立即备份</button>
            <button class="set-btn" id="btn-export-all">导出全部数据</button>
            <button class="set-btn" id="btn-import-file">导入数据…</button>
          </div>
          <div class="set-list" id="backup-list"></div>
        </section>

        <section class="set-section">
          <h3>审计日志（最近 200 条）</h3>
          <div class="set-log" id="audit-log"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- 手机端侧边栏抽屉遮罩 -->
  <div class="sidebar-mask" id="sidebar-mask" hidden></div>

  <!-- 通用右键菜单（目录树节点等） -->
  <div class="ctx-menu" id="ctx-menu"></div>

  <!-- 图片菜单（点图片右上角三点弹出） -->
  <div class="img-ctx-menu" id="img-ctx-menu" hidden>
    <div class="img-ctx-section">
      <div class="img-ctx-field">
        <label>图片地址</label>
        <input id="img-ctx-src" readonly>
      </div>
      <div class="img-ctx-field">
        <label>标题</label>
        <input id="img-ctx-title" placeholder="可选的图片标题">
      </div>
      <div class="img-ctx-field">
        <label>提示文本</label>
        <input id="img-ctx-alt" placeholder="图片加载失败时显示">
      </div>
    </div>
    <div class="img-ctx-section">
      <button data-act="copy-url"><span class="mi">⎘</span>复制地址</button>
      <button data-act="copy-img"><span class="mi">⎘</span>复制图片</button>
      <button data-act="cut-img"><span class="mi">✂</span>剪切</button>
      <button data-act="del-img" class="danger"><span class="mi">✕</span>删除</button>
    </div>
    <div class="img-ctx-section">
      <button data-act="rotl"><span class="mi">↺</span>向左旋转 90°</button>
      <button data-act="rotr"><span class="mi">↻</span>向右旋转 90°</button>
      <button data-act="fit"><span class="mi">⇔</span>适应宽度</button>
      <button data-act="reset"><span class="mi">↺</span>恢复原始尺寸</button>
    </div>
    <div class="img-ctx-section">
      <button data-act="rename"><span class="mi">✎</span>重命名</button>
      <button data-act="align-center" data-align="center"><span class="mi">☰</span>居中</button>
      <button data-act="align-left" data-align="left"><span class="mi">☰</span>居左</button>
    </div>
    <div class="img-ctx-section img-size-section">
      <div class="img-size-control">
        <button class="img-size-title" data-submenu="width">
          宽度 <span class="sub-arrow">›</span>
        </button>
        <div class="img-size-sub" data-submenu="width">
          <div class="img-size-row">
            <input type="number" id="img-width-px" class="img-size-px" min="1" placeholder="px">
            <span class="img-unit">px</span>
          </div>
          <div class="img-size-row">
            <input type="range" id="img-width-pct" class="img-size-slider" min="10" max="200" step="5" value="100">
            <span class="img-pct" id="img-width-pct-label">100%</span>
          </div>
          <div class="img-size-presets" data-kind="width">
            <button data-pct="25">25%</button>
            <button data-pct="33">33%</button>
            <button data-pct="50">50%</button>
            <button data-pct="67">67%</button>
            <button data-pct="75">75%</button>
            <button data-pct="100">100%</button>
          </div>
          <button class="img-size-reset" data-reset="width">默认</button>
        </div>
      </div>
      <div class="img-size-control">
        <button class="img-size-title" data-submenu="height">
          高度 <span class="sub-arrow">›</span>
        </button>
        <div class="img-size-sub" data-submenu="height">
          <div class="img-size-row">
            <input type="number" id="img-height-px" class="img-size-px" min="1" placeholder="px">
            <span class="img-unit">px</span>
          </div>
          <div class="img-size-row">
            <input type="range" id="img-height-pct" class="img-size-slider" min="10" max="200" step="5" value="100">
            <span class="img-pct" id="img-height-pct-label">100%</span>
          </div>
          <div class="img-size-presets" data-kind="height">
            <button data-pct="25">25%</button>
            <button data-pct="33">33%</button>
            <button data-pct="50">50%</button>
            <button data-pct="67">67%</button>
            <button data-pct="75">75%</button>
            <button data-pct="100">100%</button>
          </div>
          <button class="img-size-reset" data-reset="height">默认</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=20261126d"></script>
</body>
</html>
